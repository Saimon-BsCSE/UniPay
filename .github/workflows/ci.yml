# Builds UniPay and runs the full test suite on every push and pull request.
#
# Uses the checked-in Maven wrapper (./mvnw) so CI builds with the same pinned
# Maven version as a local build, and JDK 21 to match <java.version> in pom.xml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes any in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      # The wrapper needs its executable bit, which git preserves via .gitattributes.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload runnable jar
        uses: actions/upload-artifact@v4
        with:
          name: unipay-jar
          path: target/unipay-*.jar
          if-no-files-found: error
