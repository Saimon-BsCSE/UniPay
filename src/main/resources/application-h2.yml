# Zero-setup demo profile: H2 file-backed database running in MySQL
# compatibility mode with AUTO_SERVER for concurrent IDE access.
spring:
  datasource:
    url: jdbc:h2:file:./data/unipay;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=TIMESTAMP;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
  h2:
    console:
      enabled: true
      path: /h2-console
