spring:
  application:
    name: unipay
  profiles:
    active: h2                     # default = zero-setup demo; use 'mysql' for the submission database
  web:
    resources:
      # Never let the browser cache style.css / app.js — they are edited constantly
      # during development and a stale copy silently hides the latest fixes.
      cache:
        cachecontrol:
          no-store: true
          no-cache: true
          must-revalidate: true
        period: 0
  jpa:
    hibernate:
      ddl-auto: none               # schema is owned by db/schema-*.sql (exact proposal DDL)
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: always

app:
  jwt:
    # HS256 signing key (>= 64 bytes). Override in production: UNIPAY_JWT_SECRET
    secret: ${UNIPAY_JWT_SECRET:unipay-cse3118-lab-project-jwt-signing-key-please-change-in-production-0123456789abcdef}
    expiration-ms: 86400000       # 24 hours
  qr:
    dynamic-ttl-seconds: 300      # dynamic (one-time) QR codes expire after 5 minutes
  async:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 100

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    bd.edu.uiu.unipay: INFO

    org:
      hibernate:
        orm:
          jdbc:
            bind=TRACE:

# ── bKash Tokenized Checkout API v1.2.0-beta ────────────────────────────────
# Sandbox: https://tokenized.sandbox.bka.sh/v1.2.0-beta
# Live:    https://tokenized.pay.bka.sh/v1.2.0-beta
# Set the four credential env-vars before running against the real sandbox.
bkash:
  base-url: ${BKASH_BASE_URL:https://tokenized.sandbox.bka.sh/v1.2.0-beta}
  app-key: ${BKASH_APP_KEY:SANDBOX_APP_KEY}
  app-secret: ${BKASH_APP_SECRET:SANDBOX_APP_SECRET}
  username: ${BKASH_USERNAME:SANDBOX_USERNAME}
  password: ${BKASH_PASSWORD:SANDBOX_PASSWORD}
  callback-url: ${BKASH_CALLBACK_URL:http://localhost:8080/api/bkash/callback}