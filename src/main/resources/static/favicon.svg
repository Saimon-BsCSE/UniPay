      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="unipay-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F26522" flood-opacity="0.45"/>
