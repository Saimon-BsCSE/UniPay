  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="17.25" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  
  <!-- Interlocking Modern "U" & Dynamic Flow -->
  <path d="M16 16 C16 14.5 17.5 13.5 19 14.5 L24 18 C25 18.7 25.5 19.8 25.5 21 L25.5 35 C25.5 39.5 28.5 42.5 33 42.5 C37.5 42.5 40.5 39.5 40.5 35 L40.5 21 C40.5 19.8 41 18.7 42 18 L47 14.5 C48.5 13.5 50 14.5 50 16 L50 36 C50 45 42 51 32 51 C22 51 14 45 14 36 Z" 
        fill="url(#unipay-orange)" filter="url(#unipay-glow)"/>
        
  <!-- Intersecting Dynamic Currency Ribbon / SplitPay Node loop -->
  <path d="M22 28 C22 22 27 17 33 17 C39 17 44 22 44 28 C44 32 41 35 37 36 C35 36.5 33 35.5 32 34 C31 32.5 31.5 30.5 33 29.5 C34.5 28.5 36 27.5 36 26 C36 24 34.5 22.5 32.5 22.5 C30.5 22.5 29 24 29 26 L29 32 C29 34 27.5 35.5 25.5 35.5 C23.5 35.5 22 34 22 32 Z" 
